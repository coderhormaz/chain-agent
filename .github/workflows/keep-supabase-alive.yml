name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours (UTC)
  workflow_dispatch:       # Allow manual trigger too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl "https://dsuayobgfkvnozgtkqnh.supabase.co/rest/v1/ping?apikey=${{ secrets.SUPABASE_ANON_KEY }}"
